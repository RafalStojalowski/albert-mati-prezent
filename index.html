<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#1f6f5c">
  <title>Zaspiańska gra</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="map"></div>

  <header class="topbar">
    <span class="title">Zaspiańska gra</span>
    <span class="progress" id="progress">0/5</span>
  </header>

  <div class="gps-status" id="gpsStatus">Szukam sygnału GPS…</div>

  <div class="controls">
    <button class="round-btn" id="btnCenter" title="Pokaż moją pozycję" aria-label="Pokaż moją pozycję">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg>
    </button>
    <button class="round-btn" id="btnMenu" title="Menu" aria-label="Menu">
      <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
    </button>
  </div>

  <div class="menu hidden" id="menu">
    <button id="btnReset">Wyzeruj postęp</button>
    <button id="btnCloseMenu">Zamknij</button>
  </div>

  <button class="ar-open hidden" id="btnAr">📷 Otwórz kamerę</button>

  <div class="toast hidden" id="toast"></div>

  <!-- Nakładka widoku AR (w WebXR jako dom-overlay) -->
  <div class="ar-overlay hidden" id="arOverlay">
    <div class="ar-top">
      <div class="ar-label"></div>
      <div class="ar-hint"></div>
    </div>
    <div class="ar-crosshair"></div>
    <div class="ar-bottom">
      <button class="ar-left" aria-label="Obróć w lewo">◀</button>
      <button class="ar-calibrate">Kalibruj</button>
      <button class="ar-right" aria-label="Obróć w prawo">▶</button>
      <button class="ar-close" aria-label="Zamknij kamerę">✕</button>
    </div>
  </div>

  <div class="overlay" id="startScreen">
    <div class="card">
      <h1>Zaspiańska gra</h1>
      <p>Dzień dobry, dzisiaj będziemy chodzić po Zaspie. Jeżeli nie jesteś teraz na Zaspie to idź na Zaspę</p>
      <p class="hint">Musisz pozwolić na udostępnianie lokalizacji bo inaczej nie ma sensu. Trzymaj ekran włączony.</p>
      <button class="primary" id="btnStart">Start</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
